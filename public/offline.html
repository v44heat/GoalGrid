<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07140e">
  <title>Offline | eFootball League</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
      background: radial-gradient(ellipse at top, #173a28 0%, #07140e 60%); color: #eef3ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { max-width: 380px; }
    svg { width: 96px; height: 96px; margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; color: #a9b8ac; line-height: 1.5; }
    button {
      font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 10px;
      background: #3fdc7f; color: #07140e; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #eef3ea; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 100 100" fill="none" stroke="#3fdc7f" stroke-width="5" aria-hidden="true">
      <circle cx="50" cy="50" r="30"/><line x1="14" y1="50" x2="86" y2="50"/>
      <circle cx="50" cy="50" r="6" fill="#eef3ea" stroke="none"/>
    </svg>
    <h1>You are offline</h1>
    <p>The league needs an internet connection to show the latest scores. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
